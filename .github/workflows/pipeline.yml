name: CI/CD Pipeline - Microservicio Facturacion

on:
  push:
    branches: [ develop, main, "feature/**" ]
  pull_request:
    branches: [ develop, main ]

env:
  IMAGE_NAME: duoc/caso02-facturacion

jobs:
  # ==========================================
  # IE2: Pruebas Automatizadas y Cobertura
  # ==========================================
  tests:
    name: IE2 - Pruebas Unitarias y Cobertura (JUnit + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias y verificar cobertura (>= 70%)
        run: mvn -B clean verify

      - name: Subir reporte de cobertura JaCoCo como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: target/site/jacoco/

  # ==========================================
  # IE3: Seguridad y Politica de Bloqueo (Gating)
  # ==========================================
  security:
    name: IE3 - Escaneo de Seguridad con Bloqueo (Snyk)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Snyk - Analisis de dependencias con bloqueo (Severity Critical/High)
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ==========================================
  # IE1: Construccion de Contenedor Optimizado
  # ==========================================
  build:
    name: IE1 - Build Imagen Docker Multi-Stage
    runs-on: ubuntu-latest
    needs: [tests, security]
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker etiquetada con SHA y version
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:1.0.0 .
          docker images $IMAGE_NAME

  # ==========================================
  # IE4 e IE5: Despliegue, Trazabilidad y Orquestacion
  # ==========================================
  deploy:
    name: IE4 y IE5 - Deploy Simulado y Orquestacion (Docker Compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Desplegar servicio orquestado (2 replicas) con trazabilidad SHA
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Desplegando version trazable: $IMAGE_NAME:$IMAGE_TAG"
          docker compose up -d --build

      - name: Esperar arranque y verificar salud de las replicas (Post-Deploy)
        run: |
          sleep 25
          docker compose ps
          curl --fail -v http://localhost:8080/
          curl --fail -v http://localhost:8081/

      - name: Generar y guardar artefacto de trazabilidad del despliegue
        run: |
          echo "=== REGISTRO DE TRAZABILIDAD DE DESPLIEGUE ===" > deploy-traceability.txt
          echo "Fecha UTC: $(date -u)" >> deploy-traceability.txt
          echo "Repositorio: ${{ github.repository }}" >> deploy-traceability.txt
          echo "Rama/Ref: ${{ github.ref_name }}" >> deploy-traceability.txt
          echo "Commit SHA: ${{ github.sha }}" >> deploy-traceability.txt
          echo "Autor: ${{ github.actor }}" >> deploy-traceability.txt
          echo "Imagen desplegada: $IMAGE_NAME:${{ github.sha }} (v1.0.0)" >> deploy-traceability.txt
          echo "Estado de contenedores orquestados:" >> deploy-traceability.txt
          docker compose ps >> deploy-traceability.txt
          cat deploy-traceability.txt

      - name: Subir evidencia de trazabilidad
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-trazabilidad-${{ github.sha }}
          path: deploy-traceability.txt

      - name: Apagar entorno simulado
        if: always()
        run: docker compose down