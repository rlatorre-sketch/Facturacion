services:
  facturacion-svc:
    build: .
    image: duoc/caso02-facturacion:${IMAGE_TAG:-1.0.0}
    ports:
      - "8080-8081:8080"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped