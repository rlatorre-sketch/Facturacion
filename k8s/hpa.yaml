apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: facturacion-svc-hpa
  namespace: ep02
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: facturacion-svc
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60