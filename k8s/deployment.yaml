apiVersion: apps/v1
kind: Deployment
metadata:
  name: facturacion-svc
  namespace: ep02
  labels:
    app: facturacion-svc
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: facturacion-svc
  template:
    metadata:
      labels:
        app: facturacion-svc
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: facturacion-svc
          # En despliegue AWS EKS el pipeline sustituye esta imagen por el URI de ECR con GITHUB_SHA
          image: duoc/caso02-facturacion:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
            failureThreshold: 3